name: Agent Hub build check

on:
  push:
    branches:
      - "agent/agent-core-scheduler"
      - "agent/review-endpoint"
      - "agent/lifecycle-persistence"
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm test
      - run: npm run build
